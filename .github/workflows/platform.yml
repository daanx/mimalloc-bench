name: Build and run everything
on:
  workflow_call:
    inputs:
      platform:
        description: 'Base container image to build on'
        required: true
        type: string

jobs:
  build-base-with-docker:
    runs-on: ubuntu-latest
    name: Base Container
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the container registry
        uses: docker/login-action@v4
        continue-on-error: true
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Compute the cache image reference
        id: cacheref
        env:
          WRITE_CACHE: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
        run: |
          ref="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          # only pushes and the cron may write the cache; PR runs restore read-only
          if test "$WRITE_CACHE" = true; then
            echo "cache_to=type=registry,ref=$ref:cache-${{ inputs.platform }},mode=max" >> "$GITHUB_OUTPUT"
          fi

      - name: Build benchmarks in Docker
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          tags: bench
          target: bench-env
          build-args: |
            platform=${{ inputs.platform }}
          cache-from: type=registry,ref=${{ steps.cacheref.outputs.ref }}:cache-${{ inputs.platform }}
          cache-to: ${{ steps.cacheref.outputs.cache_to }}

      - name: Prune superseded cache versions
        if: steps.cacheref.outputs.cache_to != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ref="${{ steps.cacheref.outputs.ref }}"
          owner="${ref#ghcr.io/}"; owner="${owner%%/*}"
          package="${ref##*/}"
          # package owners here are User accounts (daanx, fork owners), so the
          # packages API lives under /users/ - switch to /orgs/ if that changes
          if ! gh api --paginate "/users/$owner/packages/container/$package/versions?per_page=100" > "$RUNNER_TEMP/versions.json" 2>/dev/null; then
            echo "no cache package yet; nothing to prune"
            exit 0
          fi
          # a tag push moves the tag and leaves the superseded version untagged;
          # delete untagged versions from before this run started
          ids="$(jq -rs --arg cutoff "$(date -u -d '1 minute ago' +%Y-%m-%dT%H:%M:%SZ)" '
            map(.[])
            | map(select((.metadata.container.tags // []) | length == 0))
            | map(select((.created_at | sub("\\.[0-9]+Z$"; "Z")) < $cutoff))
            | .[].id
          ' "$RUNNER_TEMP/versions.json")"
          for id in $ids; do
            if gh api -X DELETE "/users/$owner/packages/container/$package/versions/$id" > /dev/null 2>&1; then
              echo "pruned superseded cache version $id"
            else
              echo "warning: could not prune cache version $id"
            fi
          done

  build-and-benchmark-allocator:
    runs-on: ubuntu-latest
    needs: build-base-with-docker
    strategy:
      matrix:
        allocator: [ff, fg, gd, hd, hm, iso, je, kp, lf, lp, lt, mesh, mng, mi, mi2, mi3, nomesh, pa, rp, scudo, s, sm, sn, sg, tbb, tc, yal, tcg]
        testsuite: [allt]
        # Used to provide a platform-specific predicate
        predicate: [true, false]
        exclude:
          # Always exclude build when predicate is false.
          - predicate: false

          # Not currently working on any platform
          - allocator: pa

          # Alpine Specific disables.
          # dh: glibc-specific
          - allocator: dh
            predicate: ${{ inputs.platform == 'alpine' }}
          # fg: Uses execinfo.h, which is a GNU extension
          - allocator: fg
            predicate: ${{ inputs.platform == 'alpine' }}
          # gd: ?
          - allocator: gd
            predicate: ${{ inputs.platform == 'alpine' }}
          # hd: glibc-specific
          - allocator: hd
            predicate: ${{ inputs.platform == 'alpine' }}
          # lp: /__w/mimalloc-bench/mimalloc-bench/extern/lp/Source/bmalloc/libpas/src/libpas/pas_thread_local_cache.c:218:22: error: call to undeclared function 'pthread_getname_np'; ISO C99 and later do not support implicit function declarations [-Wimplicit-function-declaration]
          - allocator: lp
            predicate: ${{ inputs.platform == 'alpine' }}
          # lt: return type 'struct mallinfo' is incomplete
          - allocator: lt
            predicate: ${{ inputs.platform == 'alpine' }}
          # sm: ../src/supermalloc.h:10:31: error: expected initializer before '__THROW'
          - allocator: sm
            predicate: ${{ inputs.platform == 'alpine' }}
      fail-fast: false
    name: ${{ matrix.allocator }} - build and benchmark
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the container registry
        uses: docker/login-action@v4
        continue-on-error: true
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Compute the cache image reference
        id: cacheref
        run: echo "ref=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Unload host AppArmor profiles
        run: sudo aa-teardown || true

      # Some tests (e.g. sh6bench) keep tens of thousands of allocations live at
      # once and some allocators (e.g. hardened_malloc) map guard pages per
      # large allocation, so they hit vm.max_map_count. Increase to make them pass.
      - name: Raise vm.max_map_count for the benchmarks
        run: sudo sysctl -w vm.max_map_count=1048576

      - name: Build allocator and run benchmarks in Docker
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          target: benchmark
          ## If allocators in lt,lf,fg,gd then use a smaller set of tests.
          ## They were generally failing on lean or redis, and lf was also failing on mstress.
          ## ff: xmalloc-testN and sh8benchN abort intermittently under ff
          build-args: |
            platform=${{ inputs.platform }}
            allocator=${{ matrix.allocator }}
            benchs=${{ (contains('lt,lf,gd', matrix.allocator) && 'cfrac espresso barnes larson-sized mstress rptest gs lua') || ('fg' == matrix.allocator && 'cfrac espresso barnes gs lua') || ('ff' == matrix.allocator && 'allt no-sh8bench no-xmalloc-test') || 'allt' }}
            repeats=1
          cache-from: type=registry,ref=${{ steps.cacheref.outputs.ref }}:cache-${{ inputs.platform }}
